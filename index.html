    <!--
      Content-Security-Policy. GitHub Pages serves static files only, so this
      meta tag is the sole delivery mechanism available (no custom HTTP
      headers). Note that per the CSP spec, frame-ancestors, report-uri, and
      sandbox are silently ignored when set via <meta> — they require a real
      response header, which GitHub Pages cannot provide for this repo.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self' https://www.googletagmanager.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        font-src 'self' data:;
        connect-src 'self' https://api.github.com https://github-contributions-api.jogruber.de https://api.emailjs.com https://www.google-analytics.com https://*.google-analytics.com https://www.google.com https://analytics.google.com https://stats.g.doubleclick.net https://*.firebaseio.com https://*.firebasedatabase.app;
        frame-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
