<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page Not Found | Ahmed Nassar</title>
    <style>
      :root {
        --primary: #646cff;
        --secondary: #535bf2;
        --bg: #ffffff;
        --fg: #213547;
        --muted: rgba(33, 53, 71, 0.7);
        --glass-border: rgba(0, 0, 0, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1a2e;
          --fg: #f5f5f7;
          --muted: rgba(245, 245, 247, 0.7);
          --glass-border: rgba(255, 255, 255, 0.12);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }

      .card {
        max-width: 480px;
      }

      .logo {
        width: 56px;
        height: 56px;
        margin-bottom: 1.5rem;
      }

      h1 {
        margin: 0;
        font-size: 5rem;
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(45deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      h2 {
        margin: 0.75rem 0 0.5rem;
        font-size: 1.4rem;
        font-weight: 600;
      }

      p {
        margin: 0 0 2rem;
        color: var(--muted);
        line-height: 1.6;
      }

      .actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 1.4rem;
        border-radius: 30px;
        font-weight: 500;
        font-size: 0.95rem;
        text-decoration: none;
        transition:
          background 0.2s ease,
          color 0.2s ease,
          box-shadow 0.2s ease;
      }

      a.btn.primary {
        background: var(--primary);
        color: #fff;
        box-shadow: 0 6px 18px rgba(100, 108, 255, 0.35);
      }

      a.btn.primary:hover {
        background: var(--secondary);
      }

      a.btn.secondary {
        border: 2px solid var(--glass-border);
        color: var(--fg);
      }

      a.btn.secondary:hover {
        border-color: var(--primary);
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/favicon.svg" alt="" class="logo" />
      <h1>404</h1>
      <h2>This page took a wrong turn</h2>
      <p>
        The page you're looking for doesn't exist or may have moved. Let's get
        you back on track.
      </p>
      <div class="actions">
        <a class="btn primary" href="/">Back to Home</a>
        <a class="btn secondary" href="/#contact">Contact Ahmed</a>
      </div>
    </div>
    <script>
      // Respect a returning visitor's saved theme choice (same key the app
      // itself uses) instead of only the OS-level prefers-color-scheme.
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.style.colorScheme = saved;
          if (saved === 'dark') {
            document.documentElement.style.setProperty('--bg', '#1a1a2e');
            document.documentElement.style.setProperty('--fg', '#f5f5f7');
            document.documentElement.style.setProperty(
              '--muted',
              'rgba(245, 245, 247, 0.7)',
            );
            document.documentElement.style.setProperty(
              '--glass-border',
              'rgba(255, 255, 255, 0.12)',
            );
          } else {
            document.documentElement.style.setProperty('--bg', '#ffffff');
            document.documentElement.style.setProperty('--fg', '#213547');
            document.documentElement.style.setProperty(
              '--muted',
              'rgba(33, 53, 71, 0.7)',
            );
            document.documentElement.style.setProperty(
              '--glass-border',
              'rgba(0, 0, 0, 0.08)',
            );
          }
        }
      } catch {
        // localStorage unavailable — the prefers-color-scheme CSS already
        // covers this case, nothing further to do.
      }
    </script>
  </body>
</html>
