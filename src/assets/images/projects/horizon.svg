<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="100%" stop-color="#0B1524" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF62" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <!-- horizon arc (time + sky) -->
  <path
    d="M 96 300 A 160 160 0 0 1 416 300"
    fill="none"
    stroke="url(#arc)"
    stroke-width="22"
    stroke-linecap="round"
  />

  <!-- sun (weather) -->
  <circle cx="256" cy="300" r="72" fill="url(#sun)" />

  <!-- clock ticks (time) -->
  <g stroke="#E7F4FF" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="150" x2="256" y2="176" />
    <line x1="366" y1="192" x2="347" y2="211" />
    <line x1="146" y1="192" x2="165" y2="211" />
  </g>
</svg>
